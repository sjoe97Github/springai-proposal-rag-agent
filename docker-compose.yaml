services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres_with_pgvector
    restart: always
    environment:
      # These environment variables will be used to initialize the database
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydatabase
    volumes:
      # This will persist your database data
      - ./data:/var/lib/postgresql/data
    ports:
      # Expose the PostgreSQL port
      - "5432:5432"

  qdrant:
    image: 'qdrant/qdrant:latest'
    ports:
      - '6333:6333'
      - '6334:6334'

  #
  # If not running ollama locally, you can uncomment this ollama service section to run it in a container.
  # Also, if you do have the ollama models already downloaded, point source to the correct local path.
  #
#  ollama:
#    image: ollama/ollama:latest
#    container_name: ollama
#    ports:
#      - "11434:11434"
#    volumes:
#      - type: bind
#        source: /Your/Home/Path/.ollama
#        target: /root/.ollama
#    restart: unless-stopped

volumes:
  chroma-data:
    driver: local
  grafana-storage: {}

networks:
  net:
    driver: bridge

