logging:
  level:
    root: INFO
    #org.springframework.ai: DEBUG
    org.springframework.ai.mcp.client: DEBUG
    #org.springframework.boot.autoconfigure: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    org.springframework.jdbc.core: DEBUG
    org.springframework.jdbc.support: DEBUG

github-mcp-server-url: http://localhost:8081

app:
  scan:
    recursive: true
    extensions: pdf,txt,docx

  match:
    top-k-similarity: 200
    top-k-aggregate: 2000
    top-k-documents: 4
    softmax-temperature: 0.10
    chunk-window-size: 3
    # sum, avg, max, softmax
    aggregate-group-score: max

  ingest:
    skipResumeIngest: true
    batchSize: 50
    # Must be smaller the maximum tokens for embedding model, larger -> irrelevant content, smaller -> more meaningful content.
    #   Experiment with different values to find the best balance for resume matching.
    overlapSize: 20
    chunkSize: 1000
    resume-resources: file:///Users/sjohnson/shared/data/resumes-m5

#  resource: https://en.wikipedia.org/wiki/Chess
#  resource: file:///Users/sjohnson/shared/data/proposals/seed-proposals/contract-proposal-1.pdf
spring:
  datasource:
      password: secret
      username: myuser
      url: jdbc:postgresql://localhost/mydatabase

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json

#    openai:
