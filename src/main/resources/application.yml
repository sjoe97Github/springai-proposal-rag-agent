app:
  scan:
    recursive: true
    extensions: pdf,txt,docx

  ingest:
    batchSize: 50
    chunkSize: 5000
    proposal-resources: file:///Users/sjohnson/shared/data/proposals/seed-proposals
    resume-resources: file:///Users/sjohnson/shared/data/resumes-m5

#  resource: https://en.wikipedia.org/wiki/Chess
#  resource: file:///Users/sjohnson/shared/data/proposals/seed-proposals/contract-proposal-1.pdf
spring:
  datasource:
      password: secret
      username: myuser
      url: jdbc:postgresql://localhost/mydatabase

  ai:
#    openai:
#      api-key: ${OPENAI_API_KEY}
#      chat:
#        options:
#          model: gpt-4o-mini
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: mervinpraison/llama3.2-3B-instruct:8b
          temperature: 0.2
      embedding:
        options:
#          model: tazarov/all-minilm-l6-v2-f32
          model: nomic-embed-text
          max-tokens: 4096
          top-k: 3

    vectorstore:
      topk: 5
      pgvector:
        remove-existing-vector-store-table: true
        # Automatically create the required schema and table on startup
        initialize-schema: true
        # The dimension of the embeddings. This must match your embedding model's output.
        # ollama show nomic-embed-text shows an 'embedding length' of 768, this must match the dimension here.
        dimensions: 768
        # The index type for fast similarity search. HNSW is recommended.
        # The PgIndexType enum defines the types of vector indexes that can be used in the PostgreSQL vector store:
        #   NONE: No index will be created on the embedding column.
        #   IVFFLAT: Uses the IVF_FLAT (Inverted File Flat) index, which is suitable for large-scale vector search and improves query performance.
        #   HNSW: Uses the HNSW (Hierarchical Navigable Small World) index, which is efficient for approximate nearest neighbor search in high-dimensional spaces.
        index-type: HNSW
        # The distance metric to use for search.
        distance-type: COSINE_DISTANCE
        # Optional: Name of the table to store vectors
#        table-name: proposals


#      qdrant:
#        initialize-schema: true
#        dimension: 384
#        collection-name: proposals
#        recreate-collection: true

    chat:
      observations:
        include-prompt: true
        include-completion: true
  application:
    name: spring-ai-proposalgen-example
  docker:
    compose:
      stop:
        command: down
        arguments: -v
      enabled: false
