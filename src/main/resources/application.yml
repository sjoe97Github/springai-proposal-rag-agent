    vectorstore:
      pgvector:
        #
        # The vector store table will be explicitly truncated if the skipResumeIngest=false; otherwise,
        # the existing table will be reused.
        #
        remove-existing-vector-store-table: false
        initialize-schema: true
#        dimensions: 1536
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
#          model: mervinpraison/llama3.2-3B-instruct:8b
          model: Llama3.3:latest
          temperature: 0.2
