logging:
  level:
    root: INFO
    org.springframework.ai: DEBUG
#    org.springframework.ai.mcp.client: DEBUG
#    org.springframework.boot.autoconfigure: DEBUG
app:
  scan:
    recursive: true
    extensions: pdf,txt,docx

  ingest:
    batchSize: 50
    chunkSize: 1000
    proposal-resources: file:///Users/sjohnson/shared/data/proposals/seed-proposals
    resume-resources: file:///Users/sjohnson/shared/data/resumes-m5

#  resource: https://en.wikipedia.org/wiki/Chess
#  resource: file:///Users/sjohnson/shared/data/proposals/seed-proposals/contract-proposal-1.pdf
spring:
  datasource:
      password: secret
      username: myuser
      url: jdbc:postgresql://localhost/mydatabase

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: mervinpraison/llama3.2-3B-instruct:8b
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text
          max-tokens: 4096
          top-k: 3

    vectorstore:
      topk: 5
      pgvector:
        remove-existing-vector-store-table: true
        initialize-schema: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

  user:
    input: What tools are available?

  mcp:
      client:
        enabled: true
        toolcallback:
          enabled: true
        stdio:
          servers-configuration: classpath:mcp-servers.json

#          connections:
#            local-mcp-service:
#                command: /Users/sjohnson/.nvm/versions/node/v18.20.6/bin/node
#                args:
#                  - /Users/sjohnson/mydev/experiments/github-repos-manager-mcp/server.cjs
#                env:
#                  GH_TOKEN: ${GH_TOKEN}
      chat:
        client:
          observations:
            log-prompt: true
            log-completion: true
            include-error-loggin: true
            log-query-response: true

  application:
    name: spring-ai-proposalgen-example
  docker:
    compose:
      stop:
        command: down
        arguments: -v
      enabled: false


management:
  tracing:
    enabled: false
    zipkin:
      enabled: false
