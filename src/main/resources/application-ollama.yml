logging:
  level:
    root: INFO
    #org.springframework.ai: DEBUG
    org.springframework.ai.mcp.client: DEBUG
    #org.springframework.boot.autoconfigure: DEBUG

github-mcp-server-url: http://localhost:8081

app:
  scan:
    recursive: true
    extensions: pdf,txt,docx

  match:
    top-k: 5

  ingest:
    skipResumeIngest: true
    batchSize: 50
    # Must be smaller the maximum tokens for embedding model, larger -> irrelevant content, smaller -> more meaningful content.
    #   Experiment with different values to find the best balance for resume matching.
    overlapSize: 20
    chunkSize: 1000
    resume-resources: file:///Users/sjohnson/shared/data/resumes-m5

spring:
  datasource:
      password: secret
      username: myuser
      url: jdbc:postgresql://localhost/mydatabase

  ai:
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          #model: mervinpraison/llama3.2-3B-instruct:8b
          #
          # Model Card: https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
          # License: https://github.com/meta-llama/llama-models/blob/main/models/llama3_1/LICENSE
          #
          # TODO - Find another model due to following error on attempt to use github mcp server:
          #           org.springframework.ai.retry.NonTransientAiException:
          #           HTTP 400 - {"error":"registry.ollama.ai/linbeiJiang/Llama-3.1-8B-Instruct:latest does not support tools"}
          #
          model: linbeiJiang/Llama-3.1-8B-Instruct
          temperature: 0.2

      embedding:
        options:
          model: bge-m3
          max-tokens: 4096
          top-k: 3
#      embedding:
#        options:
#          model: nomic-embed-text
#          max-tokens: 4096
#          top-k: 3

    vectorstore:
      topk: 5
      pgvector:
        #
        # The vector store table will be explicitly truncated if the skipResumeIngest=false; otherwise,
        # the existing table will be reused.
        #
        remove-existing-vector-store-table: false
        initialize-schema: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

